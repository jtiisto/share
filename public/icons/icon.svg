<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <g transform="translate(256,256)">
    <!-- Share arrows -->
    <g fill="none" stroke="#e94560" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <!-- Up arrow (send) -->
      <line x1="0" y1="40" x2="0" y2="-100"/>
      <polyline points="-50,-50 0,-100 50,-50"/>
      <!-- Horizontal share lines -->
      <path d="M-80,0 Q-80,80 0,80" opacity="0.6"/>
      <path d="M80,0 Q80,80 0,80" opacity="0.6"/>
    </g>
    <!-- Dots representing devices -->
    <circle cx="-100" cy="-20" r="20" fill="#e94560" opacity="0.8"/>
    <circle cx="100" cy="-20" r="20" fill="#e94560" opacity="0.8"/>
    <circle cx="0" cy="100" r="20" fill="#e94560" opacity="0.5"/>
  </g>
</svg>
